<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>100 Days of Code</title>

<meta
  name="description"
  content="Daily projects from the 100 Days of Code Python bootcamp"
>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
>


<style>

:root {

  --bg: #14171C;
  --panel: #1B1F26;
  --line: #262B33;

  --text: #E8E6E1;
  --text-dim: #8B92A0;

  --accent: #D4A657;
  --accent-dim: #8A7142;

  --radius: 3px;

}


* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    'Fraunces',
    Georgia,
    serif;

  -webkit-font-smoothing:
    antialiased;

}


a {
  color: inherit;
}


.wrap {

  max-width:
    720px;

  margin:
    0 auto;

  padding:
    5rem 1.5rem 6rem;

}


/* ==========================================
   HEADER
========================================== */

header.hero {

  margin-bottom:
    3rem;

}


.hero .back {

  display:
    inline-block;

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    0.78rem;

  color:
    var(--text-dim);

  text-decoration:
    none;

  margin-bottom:
    1.4rem;

  border-bottom:
    1px solid var(--line);

}


.hero .back:hover {

  color:
    var(--accent);

  border-bottom-color:
    var(--accent-dim);

}


.hero h1 {

  font-size:
    clamp(2rem, 5vw, 2.6rem);

  font-weight:
    500;

  line-height:
    1.15;

  margin:
    0 0 0.9rem;

  letter-spacing:
    -0.01em;

}


.hero p {

  font-size:
    1.02rem;

  line-height:
    1.65;

  color:
    var(--text-dim);

  max-width:
    34rem;

  margin:
    0;

}


/* ==========================================
   PROGRESS
========================================== */

.progress {

  margin-top:
    1.6rem;

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    0.78rem;

  color:
    var(--text-dim);

}


.fill-track {

  height:
    4px;

  background:
    var(--panel);

  border-radius:
    2px;

  margin-top:
    0.5rem;

  overflow:
    hidden;

}


.fill {

  height:
    100%;

  background:
    var(--accent);

  border-radius:
    2px;

  transition:
    width 0.4s ease;

}


/* ==========================================
   PROJECT LIST
========================================== */

#list {

  border-top:
    1px solid var(--line);

  margin-top:
    2.5rem;

}


.day {

  display:
    flex;

  align-items:
    baseline;

  gap:
    1rem;

  text-decoration:
    none;

  padding:
    1.1rem 0;

  border-bottom:
    1px solid var(--line);

  transition:
    all 0.2s ease;

  opacity:
    0;

  animation:
    rise 0.45s ease forwards;

}


@keyframes rise {

  from {

    opacity:
      0;

    transform:
      translateY(6px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


.day-num {

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    0.85rem;

  color:
    var(--accent);

  min-width:
    3.2rem;

}


.day-name {

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    1rem;

  font-weight:
    600;

  color:
    var(--text);

  flex:
    1;

}


.day-arrow {

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    0.85rem;

  color:
    var(--text-dim);

  transition:
    transform 0.2s ease;

}


.day:hover .day-name {

  color:
    var(--accent);

}


.day:hover .day-arrow {

  color:
    var(--accent);

  transform:
    translateX(5px);

}


/* ==========================================
   LOADING / ERROR
========================================== */

.message {

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    0.82rem;

  color:
    var(--text-dim);

  padding:
    2rem 0;

}


.error {

  color:
    #C97A6B;

}


/* ==========================================
   FOOTER
========================================== */

footer {

  margin-top:
    3rem;

  font-family:
    'JetBrains Mono',
    monospace;

  font-size:
    0.75rem;

  color:
    var(--text-dim);

}


footer a {

  text-decoration:
    underline;

  text-decoration-color:
    var(--line);

}


footer a:hover {

  color:
    var(--accent);

}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 500px) {

  .wrap {

    padding:
      3rem 1.1rem 4rem;

  }


  .day {

    gap:
      0.7rem;

  }


  .day-num {

    min-width:
      2.8rem;

    font-size:
      0.75rem;

  }


  .day-name {

    font-size:
      0.9rem;

  }

}


:focus-visible {

  outline:
    2px solid var(--accent);

  outline-offset:
    2px;

}

</style>

</head>


<body>


<div class="wrap">


  <!-- ========================================
       HEADER
  ========================================= -->

  <header class="hero">

    <a
      class="back"
      href="https://toomkris.github.io/"
    >
      ← back to portfolio
    </a>


    <h1>
      100 Days of Code Python
    </h1>


    <p>
      My solutions from Angela Yu's
      100 Days of Code bootcamp.
      One project per day.
    </p>


    <div class="progress">

      <span id="progress-text">
        loading…
      </span>


      <div class="fill-track">

        <div
          class="fill"
          id="progress-fill"
          style="width:0%"
        ></div>

      </div>

    </div>

  </header>


  <!-- ========================================
       PROJECT LIST
  ========================================= -->

  <div id="list">

    <div class="message">
      Loading projects…
    </div>

  </div>


  <!-- ========================================
       FOOTER
  ========================================= -->

  <footer>

    <a
      href="https://github.com/ToomKris/Python100"
      target="_blank"
      rel="noopener"
    >
      view repo on GitHub
    </a>

  </footer>


</div>


<script>


// ==================================================
// LOAD PROJECT LIST
// ==================================================
//
// The HTML does NOT contain the projects.
//
// It loads them from:
//
// projects.json
//
// ==================================================


async function loadProjects() {

  const list =
    document.getElementById("list");

  const progressText =
    document.getElementById("progress-text");

  const progressFill =
    document.getElementById("progress-fill");


  try {


    // ----------------------------------------------
    // Load projects.json
    // ----------------------------------------------

    const response =
      await fetch(
        "./projects.json?cache=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        `Could not load projects.json (${response.status})`
      );

    }


    const projects =
      await response.json();


    // ----------------------------------------------
    // Check file
    // ----------------------------------------------

    if (!Array.isArray(projects)) {

      throw new Error(
        "projects.json must contain a list of projects."
      );

    }


    // ----------------------------------------------
    // Sort by day
    // ----------------------------------------------

    projects.sort(
      (a, b) =>
        Number(a.day) -
        Number(b.day)
    );


    // ----------------------------------------------
    // Progress
    // ----------------------------------------------

    const latestDay =
      projects.length
        ? Math.max(
            ...projects.map(
              project =>
                Number(project.day)
            )
          )
        : 0;


    progressText.textContent =
      `${projects.length} of 100 days pushed · latest: day ${latestDay}`;


    progressFill.style.width =
      `${Math.min(latestDay, 100)}%`;


    // ----------------------------------------------
    // Empty list
    // ----------------------------------------------

    if (projects.length === 0) {

      list.innerHTML = `

        <div class="message">

          No projects yet.

        </div>

      `;

      return;

    }


    // ----------------------------------------------
    // Build list
    // ----------------------------------------------

    list.innerHTML = "";


    projects.forEach(
      (project, index) => {


        const link =
          document.createElement("a");


        link.className =
          "day";


        // ------------------------------------------
        // Link to view.html
        // ------------------------------------------

        link.href =

          "./view.html" +

          "?file=" +
          encodeURIComponent(project.file) +

          "&day=" +
          encodeURIComponent(project.day) +

          "&title=" +
          encodeURIComponent(project.title);


        // Animation

        link.style.animationDelay =
          `${Math.min(index * 40, 400)}ms`;


        // ------------------------------------------
        // Project display
        // ------------------------------------------

        link.innerHTML = `

          <span class="day-num">

            day ${project.day}

          </span>


          <span class="day-name">

            ${project.title}

          </span>


          <span class="day-arrow">

            →

          </span>

        `;


        list.appendChild(link);

      }
    );


  }

  catch (error) {

    console.error(error);


    list.innerHTML = `

      <div class="message error">

        Couldn't load the project list.

        <br><br>

        ${error.message}

        <br><br>

        Make sure <strong>projects.json</strong>
        exists in the same folder as index.html.

      </div>

    `;


    progressText.textContent =
      "—";


    progressFill.style.width =
      "0%";

  }

}


// ==================================================
// START
// ==================================================

loadProjects();


</script>


</body>

</html>
